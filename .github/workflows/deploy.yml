name: Build and deploy frontend-api to ECS Fargate (Dev)

# Fires only when a PR is actually merged into main — not on every push,
# not on a PR that's closed without merging. Only this repo's own service
# is touched — the backend repo has its own workflow and is never
# deployed by a frontend change, and vice versa.
on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  id-token: write   # required to assume the AWS role via OIDC
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: pgv2-poc-frontend-api
  ECS_CLUSTER: pgv2-poc-cluster
  ECS_SERVICE: pgv2-poc-frontend-api
  CONTAINER_NAME: frontend-api

concurrency:
  group: dev-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # No static AWS keys stored in GitHub — the deploy role trusts this
      # repo via the OIDC provider (token.actions.githubusercontent.com,
      # already created in the AWS account for the earlier hyventur POC).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::833179915312:role/pgv2-frontend-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged with the commit SHA only, no ":latest" — the ECR repo has tag
      # immutability enabled, so re-pushing a mutable tag on the next deploy
      # would fail outright. The SHA tag also makes it possible to tell
      # exactly which commit a running task is on.
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_SERVICE \
            --region $AWS_REGION \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Render new image into task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.pull_request.merge_commit_sha }}

      # Registers the rendered definition as a new task def revision and
      # updates the service to it — this is the explicit "deploy" step now
      # that image tags aren't reused, so there's nothing for
      # force-new-deployment to pick up implicitly.
      - name: Deploy new task definition revision to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
