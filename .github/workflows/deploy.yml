# GitHub Actions equivalent of the proven buildspec.yml (AWS CodeBuild),
# finalized for the discovery-POC throwaway account (111898801785) using
# resources already verified to exist there: hyv-discovery-cluster,
# hyv-discovery-gateway-api(-task/-svc), hyv-discovery-gateway-migrate(-task/-svc),
# and the gh-oidc-hyv-discovery-deploy-role (trust policy fixed to
# environment-based with the repo's customized numeric-ID subject claim;
# permissions policy extended with inspector2:ListCoverage/ListFindings
# for the scan-polling step below — this account uses Inspector enhanced
# scanning, not classic ECR scan-on-push, so the inspector2 API is what
# actually has data).
#
# Ported 1:1 in behavior from the buildspec, with two structural changes:
#  1. No manual `git clone` with a GITHUB_TOKEN PAT — `actions/checkout`
#     replaces the whole `install` phase's clone step natively.
#  2. AWS auth is via OIDC (`configure-aws-credentials` + the role above),
#     not CodeBuild's implicit service role.
#
# Everything else — digest-based Inspector scan polling, severity counts,
# the (currently non-blocking, matching the buildspec's own commented-out
# `#return 1`) threshold check, task-def image swap via jq, register +
# update-service + wait — is a direct port of the buildspec's logic.
#
# Before first run: repo Settings -> Environments -> dev -> Environment
# variables -> add AWS_OIDC_ROLE_ARN = arn:aws:iam::111898801785:role/gh-oidc-hyv-discovery-deploy-role

name: Deploy (CodeBuild-equivalent)

on:
  push:
    branches: [ "merge-monorepo-flat" ]

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-2
  ECS_CLUSTER: hyv-discovery-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      # Mirrors the buildspec's two `deploy_service` calls — thresholds are
      # inline literals there too (0/1/2/3 backend, 4/8/13/1 frontend), not
      # sourced from CodeBuild project env vars, so they stay inline here.
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
            ecr_repo: hyv-discovery-gateway-api
            ecs_service: hyv-discovery-gateway-api-svc
            task_def_family: hyv-discovery-gateway-api-task
            container_name: gateway-api
            max_critical: 4
            max_high: 16
            max_medium: 11
            max_low: 1
          # gateway-migrate moved from the frontend Dockerfile to the backend
          # one (2026-08-27) so the POC's topology matches the real PGv2
          # target architecture — 3 private backend API services (gateway-api,
          # checkout, gateway-migrate) behind a shared Aurora/Redis data tier,
          # with only portal public via the ALB. Its task def (revision 5+)
          # was pre-wired with DB_HOST/REDIS_HOST/etc ahead of this switch —
          # this run's image-swap step just drops the new image on top.
          # Thresholds match backend/checkout since it's now identical code.
          - name: frontend
            dockerfile: Dockerfile.backend
            ecr_repo: hyv-discovery-gateway-migrate
            ecs_service: hyv-discovery-gateway-migrate-svc
            task_def_family: hyv-discovery-gateway-migrate-task
            container_name: gateway-migrate
            max_critical: 4
            max_high: 16
            max_medium: 11
            max_low: 1
          # checkout reuses the same backend code/Dockerfile/image as
          # gateway-api, so it gets identical scan results — thresholds
          # match. Registered in Cloud Map as "checkout-service" so portal
          # can reach it.
          - name: checkout
            dockerfile: Dockerfile.backend
            ecr_repo: hyv-discovery-checkout
            ecs_service: hyv-discovery-checkout-svc
            task_def_family: hyv-discovery-checkout-task
            container_name: checkout
            max_critical: 4
            max_high: 16
            max_medium: 11
            max_low: 1
          # portal reuses the same frontend code/Dockerfile/image as
          # gateway-migrate, so it gets identical scan results — thresholds
          # match. Its task def's BACKEND_URL points at
          # checkout-service.hyv-discovery.local, not backend-service, so
          # it calls checkout rather than gateway-api.
          - name: portal
            dockerfile: Dockerfile
            ecr_repo: hyv-discovery-portal
            ecs_service: hyv-discovery-portal-svc
            task_def_family: hyv-discovery-portal-task
            container_name: portal
            max_critical: 4
            max_high: 16
            max_medium: 13
            max_low: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # Buildspec's `install` phase also ran `pip install` + `py_compile`
        # as a cheap smoke test before building images. Uncomment if you
        # want that same pre-flight check here (needs a Python setup step
        # first — left out since it's redundant with the Docker build itself
        # failing on a real syntax/dependency error anyway).
        # - run: |
        #     pip install --no-cache-dir -r requirements-backend.txt
        #     python -m py_compile app_backend.py
        #     pip install --no-cache-dir -r requirements.txt
        #     python -m py_compile app.py

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push image
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          ECR_REPOSITORY: ${{ matrix.ecr_repo }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          echo "=== $ECR_REPOSITORY: build (-f $DOCKERFILE) and push ==="
          docker build -f "$DOCKERFILE" -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Wait for Inspector scan and check severity thresholds
        env:
          ECR_REPOSITORY: ${{ matrix.ecr_repo }}
          IMAGE_TAG: ${{ github.sha }}
          MAX_CRITICAL: ${{ matrix.max_critical }}
          MAX_HIGH: ${{ matrix.max_high }}
          MAX_MEDIUM: ${{ matrix.max_medium }}
          MAX_LOW: ${{ matrix.max_low }}
        run: |
          set -e
          # NOTE: this account uses AWS Inspector's enhanced/continuous ECR
          # scanning (activated account-wide in Runbook Phase 4), not classic
          # ECR "scan on push". `aws ecr describe-image-scan-findings` only
          # ever reports on the classic scan and stays empty forever here —
          # that caused every run to time out waiting on a status that would
          # never arrive. `aws inspector2 list-coverage`/`list-findings` are
          # the correct APIs for enhanced scanning and typically resolve in
          # ~15s for these images (verified directly against this account).
          echo "=== $ECR_REPOSITORY: waiting for Inspector scan of $IMAGE_TAG ==="
          SCAN_REASON="PENDING"
          for i in $(seq 1 20); do
            SCAN_REASON=$(aws inspector2 list-coverage \
              --filter-criteria "{\"ecrImageTags\":[{\"comparison\":\"EQUALS\",\"value\":\"$IMAGE_TAG\"}],\"ecrRepositoryName\":[{\"comparison\":\"EQUALS\",\"value\":\"$ECR_REPOSITORY\"}]}" \
              --region "$AWS_REGION" --query 'coveredResources[0].scanStatus.reason' --output text 2>/dev/null | head -n1)
            [ -z "$SCAN_REASON" ] || [ "$SCAN_REASON" = "None" ] && SCAN_REASON="PENDING"
            echo "  [$i/20] scan reason: $SCAN_REASON"
            if [ "$SCAN_REASON" = "SUCCESSFUL" ]; then
              break
            fi
            sleep 10
          done

          if [ "$SCAN_REASON" != "SUCCESSFUL" ]; then
            echo "Inspector scan did not complete successfully in time (last reason: $SCAN_REASON) — blocking deploy of $ECR_REPOSITORY"
            exit 1
          fi

          get_count() {
            local sev="$1" val
            val=$(aws inspector2 list-findings \
              --filter-criteria "{\"ecrImageTags\":[{\"comparison\":\"EQUALS\",\"value\":\"$IMAGE_TAG\"}]}" \
              --region "$AWS_REGION" --query 'findings[].severity' --output text 2>/dev/null | tr '\t' '\n' | grep -c "^${sev}\$" || true)
            [ -z "$val" ] && val=0
            echo "$val"
          }
          CRITICAL=$(get_count CRITICAL)
          HIGH=$(get_count HIGH)
          MEDIUM=$(get_count MEDIUM)
          LOW=$(get_count LOW)
          echo "$ECR_REPOSITORY findings — CRITICAL=$CRITICAL HIGH=$HIGH MEDIUM=$MEDIUM LOW=$LOW"

          if [ "$CRITICAL" -gt "$MAX_CRITICAL" ] || [ "$HIGH" -gt "$MAX_HIGH" ] || [ "$MEDIUM" -gt "$MAX_MEDIUM" ] || [ "$LOW" -gt "$MAX_LOW" ]; then
            echo "Scan thresholds exceeded for $ECR_REPOSITORY (allowed: C<=$MAX_CRITICAL H<=$MAX_HIGH M<=$MAX_MEDIUM L<=$MAX_LOW)"
            # Intentionally not blocking — matches the buildspec's own
            # commented-out `#return 1` here. This is a logged warning only,
            # not a gate, exactly as currently proven in CodeBuild. Flip this
            # to `exit 1` if/when you decide to actually enforce it.
          fi
          echo "=== $ECR_REPOSITORY: scan checked — proceeding to deploy ==="

      - name: Register new task definition revision
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ matrix.ecr_repo }}
          TASK_DEF_FAMILY: ${{ matrix.task_def_family }}
          CONTAINER_NAME: ${{ matrix.container_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          aws ecs describe-task-definition --task-definition "$TASK_DEF_FAMILY" --region "$AWS_REGION" --query taskDefinition > "task-def.json"
          jq --arg IMG "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" --arg NAME "$CONTAINER_NAME" '
            .containerDefinitions = (.containerDefinitions | map(if .name == $NAME then .image = $IMG else . end))
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' "task-def.json" > "task-def-new.json" && mv "task-def-new.json" "task-def.json"
          aws ecs register-task-definition --cli-input-json "file://task-def.json" --region "$AWS_REGION"

      - name: Update service and wait for stability
        env:
          ECS_SERVICE: ${{ matrix.ecs_service }}
          TASK_DEF_FAMILY: ${{ matrix.task_def_family }}
        run: |
          set -e
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$TASK_DEF_FAMILY" --region "$AWS_REGION"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION"
          echo "=== $ECS_SERVICE: deployed and stable ==="
